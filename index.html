<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metadata Audit Simulator: Session Mode</title>

    <!-- Load Tailwind CSS (play CDN: no versioned URL available) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load React and ReactDOM (pinned versions) -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Load Babel for in-browser JSX parsing (exact version pinned for reproducibility) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <!-- Load JSZip for creating / reading the export bundle (pinned) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useMemo, useEffect } = React;

        // --- Available image models -----------------------------------------
        // api: 'imagen'  -> POST :predict        { instances:[{prompt}] }       -> predictions[0].bytesBase64Encoded
        // api: 'gemini'  -> POST :generateContent { contents:[...] }            -> candidates[0].content.parts[].inlineData.data
        // Tiers are approximate and change over time — students should check
        // Google's current pricing/availability for their own key.
        // Model availability changes and varies by key/region — use the "Detect"
        // button to list exactly what a given key supports, and "Custom model…" for
        // newer IDs. Status checked 9 Nov 2026 against the Google AI Studio and
        // OpenAI deprecation pages. Shut-down models stay in the menu so older
        // sessions can be read and replication attempts are documented; a call to
        // them fails with the provider's error.
        const MODEL_GROUPS = [
          { key: 'google',  label: 'Google — current' },
          { key: 'openai',  label: 'OpenAI — current' },
          { key: 'ending',  label: 'Deprecated — still working for now' },
          { key: 'retired', label: 'Shut down — kept for the record' },
        ];
        const MODELS = [
          { id: 'gemini-nano-banana-2.1',      group: 'google',  label: 'Gemini Nano Banana 2.1',                         api: 'gemini', tier: 'Google — requires billing. Current main model.' },
          { id: 'gemini-3.1-flash-lite-image', group: 'google',  label: 'Gemini 3.1 Flash-Lite Image (cheapest)',         api: 'gemini', tier: 'Google — requires billing. Fastest and cheapest.' },
          { id: 'gemini-3.1-flash-image',      group: 'google',  label: 'Gemini 3.1 Flash Image',                         api: 'gemini', tier: 'Google — requires billing. Previous generation.' },
          { id: 'gemini-3-pro-image',          group: 'google',  label: 'Gemini 3 Pro Image (premium)',                   api: 'gemini', tier: 'Google — requires billing. Most expensive.' },
          { id: 'gpt-image-2.6-sunburst',      group: 'openai',  label: 'OpenAI GPT-Image-2.6 Sunburst',                  api: 'openai', tier: 'OpenAI — requires billing. Detailed work.' },
          { id: 'gpt-image-2.6-flare',         group: 'openai',  label: 'OpenAI GPT-Image-2.6 Flare (fast)',              api: 'openai', tier: 'OpenAI — requires billing. Fast iteration.' },
          { id: 'gpt-image-2.5-sunburst',      group: 'openai',  label: 'OpenAI GPT-Image-2.5 Sunburst',                  api: 'openai', tier: 'OpenAI — requires billing.' },
          { id: 'gpt-image-2.5-flare',         group: 'openai',  label: 'OpenAI GPT-Image-2.5 Flare (fast)',              api: 'openai', tier: 'OpenAI — requires billing.' },
          { id: 'gemini-2.5-flash-image',      group: 'ending',  label: 'Gemini 2.5 Flash Image (deprecated — until ≥ 15 Mar 2027)', api: 'gemini', tier: 'Google — requires billing. Deprecated; used in the July 2026 runs.' },
          { id: 'gpt-image-1.5',               group: 'ending',  label: 'OpenAI GPT-Image-1.5 (deprecated — until 1 Dec 2026)',       api: 'openai', tier: 'OpenAI — requires billing. Deprecated.' },
          { id: 'gpt-image-1-mini',            group: 'ending',  label: 'OpenAI GPT-Image-1 Mini (deprecated — until 1 Dec 2026)',    api: 'openai', tier: 'OpenAI — requires billing. Deprecated.' },
          { id: 'imagen-4.0-generate-001',     group: 'retired', label: 'Imagen 4 (deprecated — shut down 17 Aug 2026)',              api: 'imagen', tier: 'Shut down; calls will fail.' },
          { id: 'gpt-image-1',                 group: 'retired', label: 'OpenAI GPT-Image-1 (deprecated — shut down 23 Oct 2026)',    api: 'openai', tier: 'Shut down; calls will fail.' },
          { id: 'dall-e-3',                    group: 'retired', label: 'OpenAI DALL·E 3 (deprecated — shut down 12 May 2026)',       api: 'openai', tier: 'Shut down; calls will fail.' },
        ];
        // Default: the one model shared with the July 2026 pilot runs.
        const DEFAULT_MODEL = 'gemini-2.5-flash-image';
        // Task framing placed before context + metadata. Kept neutral on purpose:
        // no style ("photorealistic"), no object type ("the item"), so it states
        // the task without adding information the record doesn't have.
        const DEFAULT_INSTRUCTION = 'Generate an image based on the following catalogue metadata.';
        const CUSTOM = '__custom__';

        // --- IndexedDB helpers (store full sessions, incl. base64 images) ---
        function idbOpen() {
          return new Promise((resolve, reject) => {
            const req = indexedDB.open('metadata-audit', 1);
            req.onupgradeneeded = () => { req.result.createObjectStore('sessions'); };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        }
        async function idbSet(key, value) {
          const db = await idbOpen();
          return new Promise((resolve, reject) => {
            const tx = db.transaction('sessions', 'readwrite');
            tx.objectStore('sessions').put(value, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }
        async function idbGet(key) {
          const db = await idbOpen();
          return new Promise((resolve, reject) => {
            const tx = db.transaction('sessions', 'readonly');
            const rq = tx.objectStore('sessions').get(key);
            rq.onsuccess = () => resolve(rq.result);
            rq.onerror = () => reject(rq.error);
          });
        }

        // Stable fingerprint for a dataset so we can match saved sessions.
        function fingerprint(headers, data) {
          const s = headers.join('|') + '#' + data.length + '#' + (data[0] ? JSON.stringify(data[0]) : '');
          let h = 0;
          for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
          return 'ds_' + h.toString(16);
        }

        // A record holds the per-row audit notes plus an array of generation "runs".
        // Accepts older single-image records and upgrades them to the runs shape.
        function normalizeRecord(rec) {
          if (!rec) return { auditNotes: '', runs: [] };
          if (Array.isArray(rec.runs)) return { auditNotes: rec.auditNotes || '', runs: rec.runs };
          const runs = rec.imageBase64 ? [{
            imageBase64: rec.imageBase64,
            timestamp: rec.timestamp || '',
            promptText: rec.promptText || '',
            selectedColumns: rec.selectedColumns || [],
            model: rec.model || ''
          }] : [];
          return { auditNotes: rec.auditNotes || '', runs };
        }

        // Render a metadata value, turning any http(s) URLs into clickable links.
        function renderWithLinks(value) {
          const str = String(value);
          const parts = str.split(/(https?:\/\/[^\s|,]+)/g);
          return parts.map((p, i) =>
            /^https?:\/\//.test(p)
              ? <a key={i} href={p} target="_blank" rel="noopener noreferrer" className="text-indigo-300 underline break-all hover:text-indigo-200">{p}</a>
              : p
          );
        }

        // --- Demo image (no API call): deterministic placeholder ------------
        function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
          const words = text.split(' ');
          let line = '', lines = 0;
          for (let n = 0; n < words.length; n++) {
            const test = line + words[n] + ' ';
            if (ctx.measureText(test).width > maxWidth && line !== '') {
              ctx.fillText(line.trim(), x, y);
              line = words[n] + ' ';
              y += lineHeight;
              if (++lines >= maxLines - 1) { ctx.fillText(line.trim() + ' …', x, y); return; }
            } else {
              line = test;
            }
          }
          ctx.fillText(line.trim(), x, y);
        }
        function makeDemoImage(prompt) {
          const SIZE = 768;
          const canvas = document.createElement('canvas');
          canvas.width = SIZE; canvas.height = SIZE;
          const ctx = canvas.getContext('2d');

          let h = 0;
          for (let i = 0; i < prompt.length; i++) h = (h * 31 + prompt.charCodeAt(i)) >>> 0;
          const hue = h % 360;

          const grad = ctx.createLinearGradient(0, 0, SIZE, SIZE);
          grad.addColorStop(0, `hsl(${hue} 60% 55%)`);
          grad.addColorStop(1, `hsl(${(hue + 80) % 360} 55% 32%)`);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, SIZE, SIZE);

          for (let i = 0; i < 6; i++) {
            h = (h * 1103515245 + 12345) >>> 0; const cx = h % SIZE;
            h = (h * 1103515245 + 12345) >>> 0; const cy = h % SIZE;
            h = (h * 1103515245 + 12345) >>> 0; const r = 50 + (h % 180);
            ctx.fillStyle = `hsla(${(hue + i * 40) % 360} 70% 75% / 0.22)`;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
          }

          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.fillRect(0, 290, SIZE, 188);
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.font = 'bold 30px sans-serif';
          ctx.fillText('DEMO MODE — no AI call', SIZE / 2, 335);
          ctx.font = '16px monospace';
          wrapText(ctx, prompt, SIZE / 2, 372, 680, 22, 5);
          return canvas.toDataURL('image/png');
        }

        // --- Friendly API errors --------------------------------------------
        function apiError(status, data) {
          const msg = (data && data.error && data.error.message) ? ` — ${data.error.message}` : '';
          if (status === 400) return new Error(`Bad request (400). The model may not support image generation, or the prompt was rejected.${msg}`);
          if (status === 401 || status === 403) return new Error(`Access denied (${status}). Your key may be invalid/restricted, or this model needs billing enabled on your Google account.${msg}`);
          if (status === 404) return new Error(`Model not found (404). Check the model name.${msg}`);
          if (status === 429) {
            const txt = (data && data.error && data.error.message) || '';
            if (/limit:\s*0|free_tier/i.test(txt)) {
              return new Error(`Image generation isn't available on this key's FREE tier (quota is 0). To generate images you must enable billing on the Google account for this key — image models (Imagen + Gemini image) are paid-only. Until then, use Demo Mode.${msg}`);
            }
            if (/per[_\s-]?day|requests?_per_day/i.test(txt)) {
              return new Error(`Daily quota reached for this model. Google caps requests-per-day per tier (e.g. Imagen 4 ≈ 70/day on paid Tier 1). It resets at midnight US-Pacific time. Options: switch to another model (Gemini image has its own separate daily quota), request a higher quota in Google Cloud → IAM & Admin → Quotas, or continue tomorrow.${msg}`);
            }
            return new Error(`Rate limit reached (429) — too many requests in a short window. Wait a few seconds and retry.${msg}`);
          }
          return new Error(`API error (${status}).${msg}`);
        }

        async function callImagen(model, key, prompt) {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:predict?key=${key}`,
            { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ instances: [{ prompt }], parameters: { sampleCount: 1 } }) }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) throw apiError(res.status, data);
          const b64 = data.predictions && data.predictions[0] && data.predictions[0].bytesBase64Encoded;
          if (!b64) {
            // HTTP 200 but no image = the model filtered/refused this record.
            const p0 = (data.predictions && data.predictions[0]) || {};
            const reason = p0.raiFilteredReason || p0.raiReason || 'No image returned — the model blocked/filtered this record (safety refusal).';
            return { image: null, refusal: reason };
          }
          return { image: `data:image/png;base64,${b64}` };
        }

        async function callGemini(model, key, prompt) {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
            { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ role: 'user', parts: [{ text: prompt }] }],
                generationConfig: { responseModalities: ['IMAGE', 'TEXT'] }
              }) }
          );
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) throw apiError(res.status, data);
          const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
          const part = parts.find(p => (p.inlineData && p.inlineData.data) || (p.inline_data && p.inline_data.data));
          const inline = part && (part.inlineData || part.inline_data);
          if (!inline || !inline.data) {
            const cand = (data.candidates && data.candidates[0]) || {};
            const textOut = parts.map(p => p.text).filter(Boolean).join(' ').trim();
            const reason = (cand.finishReason && cand.finishReason !== 'STOP')
              ? `Blocked/refused (finishReason: ${cand.finishReason})`
              : (textOut ? `Text-only response: ${textOut.slice(0, 300)}` : 'No image returned (likely refusal).');
            return { image: null, refusal: reason };
          }
          const mime = inline.mimeType || inline.mime_type || 'image/png';
          return { image: `data:${mime};base64,${inline.data}` };
        }

        // --- Results page written into each export ZIP ------------------------
        // Self-contained HTML: one card per audited record, the original image
        // (if the record has an image / IIIF info.json / IIIF manifest URL in any
        // column) next to every generated run. IIIF manifests are resolved in the
        // viewer's browser at viewing time (v2 and v3).
        function buildResultsHtml(data) {
          const json = JSON.stringify(data).replace(/</g, '\\u003c');
          return `<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit results — ${String(data.sourceFile).replace(/[<>&"]/g, '')}</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#4f46e5;--bad:#b91c1c;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111827;--fg:#e5e7eb;--mut:#94a3b8;--line:#1f2937;--acc:#a5b4fc;--bad:#fca5a5;--chip:#1e1b4b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 4px}.meta{color:var(--mut);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.bar input,.bar select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
main{padding:16px;display:grid;gap:16px;max-width:1400px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
figure img{width:100%;height:260px;object-fit:contain;background:#00000010;border-radius:4px;cursor:zoom-in}
figcaption{font-size:12px;color:var(--mut);margin-top:6px;overflow-wrap:anywhere}
.orig{border-color:var(--acc)}.lbl{font-weight:600;color:var(--fg)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:0 8px;margin:2px 4px 0 0;font-size:11px;color:var(--fg)}
.refused{color:var(--bad);font-size:13px;height:260px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--bad);border-radius:4px;padding:8px}
.none{color:var(--mut);height:260px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--line);border-radius:4px;padding:8px}

table{border-collapse:collapse;width:100%;font-size:12px}td{border-top:1px solid var(--line);padding:3px 6px;vertical-align:top;overflow-wrap:anywhere}td:first-child{color:var(--mut);white-space:nowrap}
.prompt{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mut)}
a{color:var(--acc)}

</style></head><body>
<header><h1>Metadata audit — results</h1>
<div class="meta" id="meta"></div>
<div class="bar"><input id="q" placeholder="Search records…" size="24">
<select id="fm"><option value="">All models</option></select>
<select id="fs"><option value="">All statuses</option><option value="ok">Generated</option><option value="refused">Refused</option></select>
<select id="fo"><option value="">Any original</option><option value="yes">Has original image</option><option value="no">No original image</option></select></div>
</header>
<main id="list"></main><div id="zoom"><img alt=""></div>
<script>
const DATA = ${json};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const URL_RE = /https?:\\/\\/[^\\s|,;"']+/g;
const PRI = /iiif|manifest|image|thumb|img|picture|media|url|link/i;
function findMedia(row){
  const keys = Object.keys(row).sort((a,b)=>(PRI.test(b)?1:0)-(PRI.test(a)?1:0));
  const links = [];
  for (const k of keys){ for (const u of (String(row[k]||'').match(URL_RE)||[])){
    if (/\\/info\\.json$/i.test(u)) return {kind:'image', url:u.replace(/\\/info\\.json$/i,'/full/800,/0/default.jpg'), field:k};
    if (/\\.(jpe?g|png|gif|webp|tiff?)(\\?|$)/i.test(u) || /\\/full\\/[^/]+\\/\\d+\\/default\\./.test(u)) return {kind:'image', url:u, field:k};
    if (/manifest(\\.json)?(\\?|$)/i.test(u)) return {kind:'manifest', url:u, field:k};
    links.push({k,u});
  }}
  return {kind:'none', links};
}
async function fromManifest(url){
  const m = await (await fetch(url)).json();
  let res, svc;
  if (m.sequences){ res = m.sequences[0].canvases[0].images[0].resource; svc = res.service && (res.service['@id']||res.service.id); }
  else { res = m.items[0].items[0].items[0].body; const s = [].concat(res.service||[])[0]; svc = s && (s['@id']||s.id); }
  return svc ? svc.replace(/\\/$/,'') + '/full/800,/0/default.jpg' : (res['@id']||res.id);
}
const models = new Set();
DATA.records.forEach(r => (r.runs||[]).forEach(x => x.model && models.add(x.model)));
const fm = document.getElementById('fm'); [...models].sort().forEach(m => fm.insertAdjacentHTML('beforeend', '<option>'+esc(m)+'</option>'));
const nRuns = DATA.records.reduce((a,r)=>a+(r.runs||[]).length,0);
document.getElementById('meta').innerHTML = 'Source file: <b>'+esc(DATA.sourceFile)+'</b> · exported '+esc(new Date(DATA.exportIso).toLocaleString())+' · '+DATA.records.length+' records · '+nRuns+' runs';
const list = document.getElementById('list');
const cards = DATA.records.map(r => {
  const row = r.row || {}; const media = findMedia(row);
  const title = row.title || row.Title || row.title_he || row.title_en || row['dcterms:title'] || row.name || row['שם'] || row.sample_id || ('Row ' + r.index);
  const el = document.createElement('section'); el.className = 'card';
  let orig;
  if (media.kind === 'none') orig = '<div class="none">No image URL in this record'+(media.links.length?'<br>'+media.links.slice(0,3).map(l=>'<a href="'+esc(l.u)+'" target="_blank">'+esc(l.k)+'</a>').join(' · '):'')+'</div>';
  else orig = '<img alt="original" loading="lazy" data-kind="'+media.kind+'" data-src="'+esc(media.url)+'">';
  const runs = (r.runs||[]).map(x => {
    const tags = ['<span class="chip">'+esc(x.model||'?')+'</span>', '<span class="chip">instruction '+(x.instruction?'on':'off')+'</span>', '<span class="chip">context '+(x.context?'on':'off')+'</span>','<span class="chip">empty fields '+(x.omitEmpty===true?'omitted':x.omitEmpty===false?'kept':'?')+'</span>'].join('');
    const body = x.status === 'refused' || !x.file ? '<div class="refused">Refused / no image<br>'+esc(x.refusalReason||'')+'</div>' : '<img alt="generated" loading="lazy" src="'+esc(x.file)+'">';
    return '<figure data-model="'+esc(x.model)+'" data-status="'+esc(x.status||'ok')+'">'+body+'<figcaption><span class="lbl">Run '+x.run+'</span> · '+esc((x.timestamp||'').slice(0,16).replace('T',' '))+'<br>'+tags+'<details><summary>Prompt</summary><div class="prompt" dir="auto">'+esc(x.promptText)+'</div></details></figcaption></figure>';
  }).join('');
  const rec = Object.keys(row).map(k => { const v = String(row[k]||''); return '<tr><td>'+esc(k)+'</td><td dir="auto">'+(/^https?:/.test(v)?'<a href="'+esc(v)+'" target="_blank">'+esc(v)+'</a>':esc(v))+'</td></tr>'; }).join('');
  el.innerHTML = '<h2 dir="auto">'+esc(title)+' <span class="meta">· row '+r.index+'</span></h2><div class="grid"><figure class="orig">'+orig+'<figcaption><span class="lbl">Original</span>'+(media.field?' · from <code>'+esc(media.field)+'</code>':'')+'</figcaption></figure>'+runs+'</div>'+(r.auditNotes?'<p dir="auto"><b>Notes:</b> '+esc(r.auditNotes)+'</p>':'')+'<details><summary>Full original record</summary><table>'+rec+'</table></details>';
  el.dataset.text = (Object.values(row).join(' ')+' '+(r.auditNotes||'')).toLowerCase();
  el.dataset.hasorig = media.kind === 'none' ? 'no' : 'yes';
  list.appendChild(el); return el;
});
const io = new IntersectionObserver(es => es.forEach(async e => {
  if (!e.isIntersecting) return; const img = e.target; io.unobserve(img);
  try { img.src = img.dataset.kind === 'manifest' ? await fromManifest(img.dataset.src) : img.dataset.src; }
  catch(err){ img.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'Could not load original ('+err.message+')'})); }
}), {rootMargin:'400px'});
document.querySelectorAll('img[data-src]').forEach(i => io.observe(i));
function apply(){
  const q = document.getElementById('q').value.toLowerCase(), m = fm.value, s = document.getElementById('fs').value, o = document.getElementById('fo').value;
  cards.forEach(c => {
    let any = false;
    c.querySelectorAll('figure[data-status]').forEach(f => { const ok = (!m||f.dataset.model===m)&&(!s||f.dataset.status===s); f.style.display = ok?'':'none'; any = any||ok; });
    const noRuns = !c.querySelector('figure[data-status]');
    c.style.display = (!q||c.dataset.text.includes(q)) && (!o||c.dataset.hasorig===o) && (any||(noRuns&&!m&&!s)) ? '' : 'none';
  });
}
['q','fm','fs','fo'].forEach(id => document.getElementById(id).addEventListener('input', apply));

        async function callOpenAI(model, key, prompt) {
          const body = { model, prompt, n: 1, size: '1024x1024' };
          let res;
          try {
            res = await fetch('https://api.openai.com/v1/images/generations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
              body: JSON.stringify(body)
            });
          } catch (e) {
            throw new Error('Could not reach OpenAI from the browser (possible CORS/network block). If this persists, we can route OpenAI through the class proxy.');
          }
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            const em = (data.error && (data.error.message || data.error.code)) || `OpenAI error ${res.status}`;
            // Content-policy rejections are refusals (a finding), not hard errors.
            if (/safety|moderation|content[_\s-]?policy|rejected|not allowed|violat/i.test(em)) {
              return { image: null, refusal: `OpenAI content policy: ${em}` };
            }
            if (res.status === 401) throw new Error(`OpenAI: invalid API key (401). ${em}`);
            if (/insufficient_quota|billing|exceeded your current quota/i.test(em)) {
              throw new Error(`OpenAI: no credits / billing not set up. Add a payment method + credits at platform.openai.com → Billing. ${em}`);
            }
            if (/does not exist|do not have access|model_not_found/i.test(em)) {
              throw new Error(`OpenAI: this model isn't available to your account/key. Usually one of: (0) the model has been shut down (see the "Shut down" group in the menu); (1) no credit balance added (platform.openai.com → Billing → "Add to credit balance"); (2) GPT-Image models need one-time Organization Verification (Settings → Organization → General → Verify); (3) a restricted project key that excludes this model. ${em}`);
            }
            if (res.status === 429) throw new Error(`OpenAI rate limit (429) — wait and retry. ${em}`);
            throw new Error(`OpenAI error (${res.status}). ${em}`);
          }
          const b64 = data.data && data.data[0] && data.data[0].b64_json;
          if (b64) return { image: `data:image/png;base64,${b64}` };
          const url = data.data && data.data[0] && data.data[0].url;
          if (url) {
            // DALL·E 3 returns a temporary URL; fetch + inline it so it persists and exports.
            try {
              const imgRes = await fetch(url);
              const blob = await imgRes.blob();
              const dataUrl = await new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = reject;
                fr.readAsDataURL(blob);
              });
              return { image: dataUrl };
            } catch (e) {
              return { image: url }; // display-only fallback (URL expires ~1h, won't export)
            }
          }
          return { image: null, refusal: 'OpenAI returned no image.' };
        }

        // Students route through the class proxy (no key in the browser).
        async function callProxy(url, code, model, prompt) {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ model: model.id, api: model.api, prompt, code })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) throw new Error(data.error || `Proxy error (${res.status}).`);
          if (data.image) return { image: data.image };
          // Newer proxy returns { refusal } on a safety block; older proxy errors above.
          return { image: null, refusal: data.refusal || 'The proxy returned no image (refusal).' };
        }
